name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7.3
      - name: Build
        run: |
          set +e
          gradle assembleDebug assembleRelease --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |What went wrong|depends on|Dependency .* requires|minCompileSdk|minAgp" -A2 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FrostWeather-release
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FrostWeather-debug
          path: app/build/outputs/apk/debug/*.apk
