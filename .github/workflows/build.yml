name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |What went wrong|depends on|Dependency .* requires|minCompileSdk|minAgp" -A2 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FrostWeather.apk
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: FrostWeather.apk
